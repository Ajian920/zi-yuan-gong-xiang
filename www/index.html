<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>资源合集分享</title>
<style>
/* ═══════════════════ TOKENS ═══════════════════ */
:root {
  --bg:       #0a0a12;
  --surface:  #12121f;
  --surface2: #1a1a2e;
  --fg:       #e0e0f0;
  --muted:    #6a6a8e;
  --border:   #2a2a45;
  --accent:   #00f0ff;
  --accent2:  #a855f7;
  --accent3:  #22d3ee;
  --success:  #10b981;
  --warn:     #f59e0b;
  --danger:   #ef4444;
  --glow:     0 0 20px rgba(0,240,255,0.3);
  --glow2:    0 0 30px rgba(168,85,247,0.25);
  --radius:   12px;
  --radius-sm: 8px;
  --font:     -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
}

/* ====== THEMES ====== */
[data-theme='aurora'] {
  --bg: #0a1a12; --surface: #101f18; --surface2: #162e20;
  --fg: #d0f0e0; --muted: #5a8e6e; --border: #1e3a28;
  --accent: #00ff88; --accent2: #00c9a7; --accent3: #34d399;
  --glow: 0 0 20px rgba(0,255,136,0.3); --glow2: 0 0 30px rgba(0,201,167,0.25);
}
[data-theme='neon'] {
  --bg: #120a18; --surface: #1a1022; --surface2: #261533;
  --fg: #f0e0ff; --muted: #8e6aae; --border: #3a2050;
  --accent: #ff00ff; --accent2: #ff6ec7; --accent3: #e040fb;
  --glow: 0 0 20px rgba(255,0,255,0.35); --glow2: 0 0 30px rgba(255,110,199,0.3);
}
[data-theme='crimson'] {
  --bg: #140a0a; --surface: #1e1010; --surface2: #2e1515;
  --fg: #f0d0d0; --muted: #ae6a6a; --border: #3a1e1e;
  --accent: #ff3333; --accent2: #ff6b6b; --accent3: #ef4444;
  --glow: 0 0 20px rgba(255,51,51,0.35); --glow2: 0 0 30px rgba(255,107,107,0.25);
}
[data-theme='ocean'] {
  --bg: #060d18; --surface: #0c1828; --surface2: #122240;
  --fg: #d0e8ff; --muted: #5a7eae; --border: #1a3055;
  --accent: #0088ff; --accent2: #00b4d8; --accent3: #38bdf8;
  --glow: 0 0 20px rgba(0,136,255,0.3); --glow2: 0 0 30px rgba(0,180,216,0.25);
}
[data-theme='forest'] {
  --bg: #0a120a; --surface: #121e12; --surface2: #1a2e1a;
  --fg: #d0f0d0; --muted: #6a9e6a; --border: #1e3a1e;
  --accent: #22c55e; --accent2: #16a34a; --accent3: #4ade80;
  --glow: 0 0 20px rgba(34,197,94,0.3); --glow2: 0 0 30px rgba(22,163,74,0.25);
}
[data-theme='sunset'] {
  --bg: #140d08; --surface: #1e1410; --surface2: #2e1e14;
  --fg: #ffe8d0; --muted: #ae8a6a; --border: #3a2818;
  --accent: #ff8c00; --accent2: #ff6347; --accent3: #ffa500;
  --glow: 0 0 20px rgba(255,140,0,0.35); --glow2: 0 0 30px rgba(255,99,71,0.25);
}
[data-theme='moonlight'] {
  --bg: #0e1018; --surface: #161a24; --surface2: #1e2433;
  --fg: #e0e8ff; --muted: #8892ae; --border: #2a3045;
  --accent: #88aaff; --accent2: #a0b4ff; --accent3: #b0c4ff;
  --glow: 0 0 20px rgba(136,170,255,0.3); --glow2: 0 0 30px rgba(160,180,255,0.25);
}
[data-theme='cyber'] {
  --bg: #0a0a14; --surface: #12101f; --surface2: #1e1a30;
  --fg: #f0e0ff; --muted: #7e6aae; --border: #2e2545;
  --accent: #e040fb; --accent2: #00e5ff; --accent3: #ff4081;
  --glow: 0 0 20px rgba(224,64,251,0.35); --glow2: 0 0 30px rgba(0,229,255,0.25);
}
[data-theme='gold'] {
  --bg: #12100a; --surface: #1e1a10; --surface2: #2e2818;
  --fg: #fff0d0; --muted: #ae9a6a; --border: #3a3020;
  --accent: #ffd700; --accent2: #daa520; --accent3: #f0c040;
  --glow: 0 0 20px rgba(255,215,0,0.35); --glow2: 0 0 30px rgba(218,165,32,0.25);
}
[data-theme='lavender'] {
  --bg: #100a18; --surface: #181022; --surface2: #241a33;
  --fg: #e8d8ff; --muted: #9070ae; --border: #302545;
  --accent: #b388ff; --accent2: #ce93d8; --accent3: #ea80fc;
  --glow: 0 0 20px rgba(179,136,255,0.35); --glow2: 0 0 30px rgba(206,147,216,0.25);
}
[data-theme='mint'] {
  --bg: #081410; --surface: #102018; --surface2: #183022;
  --fg: #d0ffe8; --muted: #5aae8a; --border: #1e3a2e;
  --accent: #00e5a0; --accent2: #34d399; --accent3: #6ee7b7;
  --glow: 0 0 20px rgba(0,229,160,0.35); --glow2: 0 0 30px rgba(52,211,153,0.25);
}
[data-theme='midnight'] {
  --bg: #060610; --surface: #0c0c1a; --surface2: #141428;
  --fg: #c8d0e8; --muted: #5060a0; --border: #1a1a3a;
  --accent: #4466ff; --accent2: #6688ff; --accent3: #88aaff;
  --glow: 0 0 20px rgba(68,102,255,0.3); --glow2: 0 0 30px rgba(102,136,255,0.25);
}
[data-theme='coral'] {
  --bg: #140a10; --surface: #1e1018; --surface2: #2e1820;
  --fg: #ffd8e8; --muted: #ae6a8a; --border: #3a2030;
  --accent: #ff6b9d; --accent2: #ff85a1; --accent3: #ff9eb5;
  --glow: 0 0 20px rgba(255,107,157,0.35); --glow2: 0 0 30px rgba(255,133,161,0.25);
}
[data-theme='ice'] {
  --bg: #0a1018; --surface: #101828; --surface2: #182038;
  --fg: #d8f0ff; --muted: #6a9eae; --border: #1e3048;
  --accent: #00d4ff; --accent2: #40e0d0; --accent3: #7dd3fc;
  --glow: 0 0 20px rgba(0,212,255,0.3); --glow2: 0 0 30px rgba(64,224,208,0.25);
}
[data-theme='amber'] {
  --bg: #12100a; --surface: #1c1810; --surface2: #2a2418;
  --fg: #fff5e0; --muted: #b0986a; --border: #383020;
  --accent: #ffb300; --accent2: #ff8f00; --accent3: #ffc107;
  --glow: 0 0 20px rgba(255,179,0,0.35); --glow2: 0 0 30px rgba(255,143,0,0.25);
}
[data-theme='rose'] {
  --bg: #140a10; --surface: #1e1218; --surface2: #2e1a22;
  --fg: #ffe0ee; --muted: #b07090; --border: #3a2230;
  --accent: #ff4da6; --accent2: #e8537a; --accent3: #ff69b4;
  --glow: 0 0 20px rgba(255,77,166,0.35); --glow2: 0 0 30px rgba(232,83,122,0.25);
}

/* ═══════════════════ RESET ═══════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  min-height: 100dvh;
  overflow-x: hidden;
  line-height: 1.6;
}
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; }
img { max-width: 100%; display: block; }

/* ═══════════════════ SCROLLBAR ═══════════════════ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ═══════════════════ ANIMATIONS ═══════════════════ */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes glow { 0%, 100% { box-shadow: var(--glow); } 50% { box-shadow: 0 0 40px rgba(0,240,255,0.5); } }
@keyframes scanline {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100vh); }
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes borderGlow {
  0%, 100% { border-color: var(--accent); }
  50% { border-color: var(--accent2); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes overlayIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes ripple {
  0% { transform: scale(0); opacity: 0.6; }
  100% { transform: scale(4); opacity: 0; }
}

/* ═══════════════════ PARTICLE BG ═══════════════════ */
#particles-canvas {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}

/* ═══════════════════ SCANLINE OVERLAY ═══════════════════ */
.scanline-overlay {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,240,255,0.015) 2px,
    rgba(0,240,255,0.015) 4px
  );
}

/* ═══════════════════ LAYOUT SHELL ═══════════════════ */
.app-shell {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  min-height: 100dvh;
}

/* ═══════════════════ TOP NAV ═══════════════════ */
.topnav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 56px;
  background: rgba(10,10,18,0.85);
  backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid var(--border);
}
.topnav-brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topnav-brand svg { flex-shrink: 0; }
.nav-update-btn {
  font-size: 15px; font-weight: 700;
  background: none; border: none; cursor: pointer;
  padding: 8px 16px; border-radius: var(--radius-sm);
  border: 1px solid rgba(0,240,255,0.2);
  transition: all 0.3s;
  white-space: nowrap;
  color: var(--accent);
  background: linear-gradient(135deg, rgba(0,240,255,0.08), rgba(168,85,247,0.08));
}
.nav-update-btn:hover {
  border-color: var(--accent);
  box-shadow: var(--glow);
  transform: translateY(-1px);
  background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(168,85,247,0.15));
}
.topnav-actions { display: flex; gap: 8px; }
.nav-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface2); border-radius: var(--radius-sm);
  color: var(--muted); transition: all 0.2s;
}
.nav-btn:hover, .nav-btn.active {
  color: var(--accent);
  background: rgba(0,240,255,0.1);
  box-shadow: var(--glow);
}

/* ═══════════════════ HERO ═══════════════════ */
.hero {
  text-align: center;
  padding: 40px 20px 30px;
  position: relative;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px;
  background: rgba(0,240,255,0.08);
  border: 1px solid rgba(0,240,255,0.2);
  color: var(--accent); font-size: 12px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
  margin-bottom: 16px;
  animation: float 3s ease-in-out infinite;
}
.hero h1 {
  font-size: clamp(28px, 6vw, 42px);
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 10px;
  background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--accent2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p {
  color: var(--muted); font-size: 15px;
  max-width: 500px; margin: 0 auto;
}

/* ═══════════════════ SOCIAL LINKS ═══════════════════ */
.social-links {
  display: flex; justify-content: center; gap: 16px;
  padding: 16px 20px;
  margin: 0 20px 20px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.social-link {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px;
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  color: var(--fg);
  text-decoration: none;
  transition: all 0.3s ease;
  font-size: 14px;
  font-weight: 500;
}
.social-link:hover {
  border-color: var(--accent);
  box-shadow: var(--glow);
  transform: translateY(-2px);
}
.social-link.qq {
  background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(0,240,255,0.05));
}
.social-link.qq:hover {
  background: linear-gradient(135deg, rgba(0,240,255,0.2), rgba(0,240,255,0.1));
}
.social-link.wechat {
  background: linear-gradient(135deg, rgba(168,85,247,0.1), rgba(168,85,247,0.05));
}
.social-link.wechat:hover {
  background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(168,85,247,0.1));
}
.social-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px; flex-shrink: 0;
}
.social-link.qq .social-icon {
  background: rgba(0,240,255,0.12);
  color: var(--accent);
}
.social-link.wechat .social-icon {
  background: rgba(168,85,247,0.12);
  color: var(--accent2);
}
.social-icon svg {
  width: 22px; height: 22px;
}
.social-text {
  display: flex; flex-direction: column;
}
.social-title {
  font-size: 14px; font-weight: 700;
  color: var(--fg);
}
.social-desc {
  font-size: 12px; color: var(--muted);
  margin-top: 2px;
}

/* ═══════════════════ TABS ═══════════════════ */
.tabs {
  display: flex; gap: 6px;
  padding: 0 20px 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px; font-weight: 600;
  background: var(--surface);
  color: var(--muted);
  border: 1px solid var(--border);
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--fg); border-color: var(--muted); }
.tab-btn.active {
  background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(168,85,247,0.15));
  color: var(--accent);
  border-color: var(--accent);
  box-shadow: var(--glow);
}

/* ═══════════════════ RESOURCE GRID ═══════════════════ */
.resources {
  padding: 0 20px 100px;
  display: flex; flex-direction: column; gap: 12px;
}
.resource-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  transition: all 0.3s;
  animation: fadeIn 0.4s ease-out both;
  position: relative;
  overflow: hidden;
}
.resource-card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 3px; height: 100%;
  border-radius: 3px 0 0 3px;
}
.resource-card.quark::before { background: linear-gradient(180deg, #6366f1, #818cf8); }
.resource-card.xunlei::before { background: linear-gradient(180deg, #3b82f6, #60a5fa); }
.resource-card.lanzou::before { background: linear-gradient(180deg, #f59e0b, #fbbf24); }

.resource-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--glow);
}
.resource-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 10px;
}
.resource-icon {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  font-size: 20px; font-weight: 800;
  flex-shrink: 0;
}
.resource-icon.quark {
  background: rgba(99,102,241,0.15); color: #818cf8;
}
.resource-icon.xunlei {
  background: rgba(59,130,246,0.15); color: #60a5fa;
}
.resource-icon.lanzou {
  background: rgba(245,158,11,0.15); color: #fbbf24;
}
.resource-info { flex: 1; margin-left: 12px; }
.resource-name {
  font-size: 15px; font-weight: 700;
  margin-bottom: 2px;
}
.resource-desc {
  font-size: 12px; color: var(--muted);
  line-height: 1.5;
}
.resource-meta {
  display: flex; align-items: center; gap: 12px;
  margin-top: 10px; flex-wrap: wrap;
}
.meta-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 600;
  background: rgba(0,240,255,0.06);
  color: var(--accent3);
  border: 1px solid rgba(0,240,255,0.12);
}
.meta-tag.type { color: var(--accent2); border-color: rgba(168,85,247,0.2); background: rgba(168,85,247,0.08); }
.meta-tag.size { color: var(--warn); border-color: rgba(245,158,11,0.2); background: rgba(245,158,11,0.08); }
.resource-actions {
  display: flex; gap: 8px; margin-top: 12px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  transition: all 0.2s;
  position: relative; overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #0a0a12;
}
.btn-primary:hover {
  box-shadow: var(--glow);
  transform: translateY(-1px);
}
.btn-secondary {
  background: var(--surface2);
  color: var(--fg);
  border: 1px solid var(--border);
}
.btn-secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.btn-sm {
  padding: 7px 12px; font-size: 12px;
}
.btn .ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  width: 20px; height: 20px;
  animation: ripple 0.6s ease-out;
}

/* ═══════════════════ SECTION HEADERS ═══════════════════ */
.section-head {
  display: flex; align-items: center; gap: 8px;
  padding: 0 20px; margin-bottom: 12px;
}
.section-head h2 {
  font-size: 16px; font-weight: 700;
}
.section-head .count {
  padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 700;
  background: rgba(0,240,255,0.1);
  color: var(--accent);
}

/* ═══════════════════ UPDATE MODAL ═══════════════════ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: overlayIn 0.3s ease-out;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%; max-width: 400px;
  padding: 0;
  animation: modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
}
.modal-glow {
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  background-size: 200% 100%;
  animation: shimmer 2s linear infinite;
}
.modal-body {
  padding: 28px 24px 20px;
  text-align: center;
}
.modal-icon {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(168,85,247,0.15));
  border: 1px solid rgba(0,240,255,0.3);
  animation: glow 2s ease-in-out infinite;
}
.modal-icon svg { color: var(--accent); }
.modal-title {
  font-size: 20px; font-weight: 800;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--fg), var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ═══════════════════ COPY ═══════════════════ */
function copyLink(url, pwd) {
  const text = pwd ? `${url}\n密码: ${pwd}` : url;
  copyText(text);
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板', 'success'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板', 'success');
  }
}

/* ═══════════════════ TOAST ═══════════════════ */
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 2500);
}

function toggleSetting(key) {
  const el = document.getElementById('toggle' + key.charAt(0).toUpperCase() + key.slice(1));
  el.classList.toggle('on');
  const on = el.classList.contains('on');

  if (key === 'particles') {
    document.getElementById('particles-canvas').style.display = on ? '' : 'none';
  } else if (key === 'scanline') {
    document.querySelector('.scanline-overlay').style.display = on ? '' : 'none';
  }

  localStorage.setItem('nv_' + key, on ? '1' : '0');
  showToast(on ? '已开启' : '已关闭');
}

function setTheme(theme) {
  if (theme) {
    document.documentElement.setAttribute('data-theme', theme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  localStorage.setItem('nv_theme', theme);
  document.querySelectorAll('.theme-swatch').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-t') === theme);
  });
  showToast('主题已切换');
}

/* ═══════════════════ PARTICLES ═══════════════════ */
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function create() {
    particles = [];
    const count = Math.min(80, Math.floor(w * h / 12000));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random() * 0.4 + 0.1,
        color: Math.random() > 0.5 ? '0,240,255' : '168,85,247'
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${p.a})`;
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const dist = dx * dx + dy * dy;
        if (dist < 12000) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(0,240,255,${0.06 * (1 - dist / 12000)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }

  resize();
  create();
  draw();
  window.addEventListener('resize', () => { resize(); create(); });
}

/* ═══════════════════ INIT ═══════════════════ */
(function init() {
  // Restore theme
  var savedTheme = localStorage.getItem('nv_theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    setTimeout(function() {
      var swatch = document.querySelector('.theme-swatch[data-t="' + savedTheme + '"]');
      if (swatch) {
        document.querySelectorAll('.theme-swatch').forEach(function(el) { el.classList.remove('active'); });
        swatch.classList.add('active');
      }
    }, 100);
  }

  // Restore settings
  ['particles', 'scanline'].forEach(key => {
    const val = localStorage.getItem('nv_' + key);
    if (val === '0') {
      const el = document.getElementById('toggle' + key.charAt(0).toUpperCase() + key.slice(1));
      if (el) el.classList.remove('on');
      if (key === 'particles') document.getElementById('particles-canvas').style.display = 'none';
      if (key === 'scanline') document.querySelector('.scanline-overlay').style.display = 'none';
    }
  });

  // Render
  renderResources();

  // Particles
  initParticles();
})();
